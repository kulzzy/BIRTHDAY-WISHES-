<!DOCTYPE html>
<html lang="en">
<head>

<title>Birthday Wishes</title>

<style>
*{box-sizing:border-box;}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 0%,rgba(30,55,100,.30),transparent 45%),
        linear-gradient(135deg,#07152f,#020b1c 70%,#06132b);
    color:#fff;
    padding:14px 8px 30px;
}

.page{width:100%;max-width:1100px;margin:auto;}

.title{
    margin:0;
    text-align:center;
    font-size:clamp(17px,5.5vw,25px);
    line-height:1.02;
    font-weight:950;
    letter-spacing:-.4px;
    text-transform:uppercase;
    color:#fff;
}

.title span{color:#ffbf16;}

.decor{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin:0 auto 9px;
}

.decor i{
    display:block;
    width:38px;
    height:2px;
    background:#ffbf16;
    border-radius:20px;
}

.decor b{
    width:6px;
    height:6px;
    background:#ffbf16;
    border-radius:50%;
}

.message-card{
    position:relative;
    width:100%;
    max-width:100%;
    height:90px;
    min-height:90px;
    margin:0 auto;
    border:2px solid #ffbf16;
    border-radius:12px;
    background:linear-gradient(135deg,#07152f,#0a2145);
    box-shadow:0 8px 20px rgba(0,0,0,.30);
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    object-position:center;
}

#wish{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    min-height:90px;
    margin:0;
    border:0;
    outline:0;
    padding:0 42px 0 14px;
    background:transparent;
    color:#ffca31;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
    font-weight:1000;
    line-height:1.12;
    cursor:pointer;
    text-align:left;
    appearance:none;
    -webkit-appearance:none;
    z-index:10;
    white-space:normal;
    overflow:hidden;
    text-overflow:ellipsis;
    -webkit-text-stroke:0;
    background-image:
        linear-gradient(45deg,transparent 50%,#ffbf16 50%),
        linear-gradient(135deg,#ffbf16 50%,transparent 50%);
    background-position:
        calc(100% - 22px) 50%,
        calc(100% - 13px) 50%;
    background-size:8px 8px,8px 8px;
    background-repeat:no-repeat;
}

#wish option{
    color:#ffca31;
    background:#07152f;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
    font-weight:1000;
    padding:8px;
}

.send{
    display:block;
    width:88%;
    min-width:0;
    margin:9px auto 20px;
    padding:11px 18px;
    border:2px solid #ffbf16;
    border-radius:14px;
    background:#07152f;
    color:#ffbf16;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(0,0,0,.30);
}

.send:active{transform:translateY(1px);}
.send:disabled{opacity:.65;cursor:not-allowed;}

.status{
    display:none;
    max-width:700px;
    margin:0 auto 20px;
    padding:14px 18px;
    border-radius:12px;
    text-align:center;
    font-weight:800;
}

.status.show{
    display:block;
    background:#153f28;
    color:#b9ffd0;
    border:1px solid #42cf75;
}

.status.error{
    background:#4a1e25;
    color:#ffd1d7;
    border-color:#ff6575;
}

@media(min-width:651px){
    body{padding:20px 14px 40px;}

    .title{
        font-size:clamp(18px,3vw,30px);
        line-height:1.02;
        letter-spacing:-.6px;
    }

    .decor{gap:6px;margin-bottom:10px;}
    .decor i{width:50px;height:2px;}
    .decor b{width:7px;height:7px;}

    .message-card{
        height:105px;
        min-height:105px;
        border-radius:14px;
    }


    #wish{
        min-height:105px;
        padding:0 50px 0 18px;
        font-size:clamp(14px,1.8vw,22px);
        line-height:1.15;
        background-position:
            calc(100% - 29px) 50%,
            calc(100% - 19px) 50%;
        background-size:9px 9px,9px 9px;
    }

    #wish option{
        font-size:17px;
        padding:8px;
    }

    .send{
        width:auto;
        min-width:240px;
        margin:10px auto 20px;
        padding:11px 24px;
        font-size:16px;
    }
}

#country{

@keyframes wishScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.announcement-title{margin:0;text-align:center;color:#06152B;font-size:clamp(19px,5vw,27px);font-weight:950;line-height:1.15;}
.announcement-subtitle{margin:7px 0 16px;text-align:center;color:#06152B;font-size:14px;font-weight:800;}
.announcement-date-wrap{margin:0 0 12px;}

.announcement-date-wrap input{display:block;width:100%;min-height:46px;padding:12px 13px;border:2px solid #ffbf16;border-radius:10px;background:#07152f;color:#fff;font:800 15px Arial,Helvetica,sans-serif;outline:none;cursor:default;}
.announcement-form{display:grid;gap:11px;}
.announcement-form input,.announcement-form select,.announcement-form textarea{display:block;width:100%;min-height:49px;padding:12px 13px;border:2px solid #ffbf16;border-radius:10px;background:#07152f;color:#ffca31;font:800 15px Arial,Helvetica,sans-serif;outline:none;}
.announcement-form textarea{min-height:88px;resize:vertical;line-height:1.45;grid-column:1/-1;}
.announcement-form textarea::placeholder{color:#e7eaf1;opacity:1;}
.announcement-word-count{grid-column:1/-1;margin-top:-6px;color:#d6b45d;font:700 12px Arial,Helvetica,sans-serif;text-align:right;}
.announcement-form input::placeholder{color:#e7eaf1;opacity:1;}
.announcement-form select option{background:#07152f;color:#ffca31;}

.celebration-picker{position:relative;width:100%;min-width:0;z-index:5;}
.celebration-picker select{position:absolute!important;width:1px!important;height:1px!important;min-height:1px!important;padding:0!important;margin:0!important;opacity:0!important;pointer-events:none!important;}

.celebration-picker-trigger:after{content:"⌄";font-size:22px;line-height:1;color:#f5d889;}

.celebration-choice{width:100%;min-height:48px;padding:11px 12px;border:1px solid rgba(255,255,255,.28);border-radius:9px;text-align:left;font:800 14px/1.3 Arial,Helvetica,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);}
.celebration-choice:active{transform:scale(.99);filter:brightness(1.12);}
.celebration-choice[aria-selected="true"]{outline:2px solid #fff;outline-offset:1px;}

.announcement-send:disabled{opacity:.65;cursor:not-allowed;}

function randomItem(items){
    return items[Math.floor(Math.random()*items.length)];
}

function refreshWishActivity(submittedWishes=[]){
    const wishOptions=Array.from(wish.options).filter(option=>option.value);
    const shuffled=wishOptions.slice();
    for(let i=shuffled.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }

    // Keep the normal random wishes moving even when nobody has submitted a wish.
    const cards=[];
    shuffled.slice(0,5).forEach(option=>cards.push({
        message:option.textContent,
        country:randomItem(countries)
    }));

    // Add real public submissions to the same moving ticker as they arrive.
    submittedWishes.slice(0,12).forEach(item=>cards.push({
        message:String(item.message||'').trim(),
        country:String(item.country||randomItem(countries)).trim()
    }));

    const usableCards=cards.filter(item=>item.message);
    if(!usableCards.length) return;

    wishActivity.replaceChildren();
    const track=document.createElement("div");
    track.className="wish-track";
    const firstGroup=document.createElement("div");
    firstGroup.className="wish-track-group";
    const secondGroup=document.createElement("div");
    secondGroup.className="wish-track-group";
    secondGroup.setAttribute("aria-hidden","true");

    function makeCard(data){
        const card=document.createElement("div");
        card.className="wish-activity-card";
        const wishText=document.createElement("div");
        wishText.className="wish-activity-text";
        wishText.textContent=data.message;
        const countryText=document.createElement("div");
        countryText.className="wish-activity-country";
        countryText.textContent=data.country;
        card.append(wishText,countryText);
        return card;
    }
    usableCards.forEach(data=>{
        firstGroup.appendChild(makeCard(data));
        secondGroup.appendChild(makeCard(data));
    });
    track.append(firstGroup,secondGroup);
    wishActivity.appendChild(track);
}

function listenForPublicWishes(){
    onValue(ref(db,"birthdayWishes"),(snapshot)=>{
        const data=snapshot.val()||{};
        // Only exact choices from the public selector are allowed into the moving ticker.
        // Older/custom messages remain in Firebase but are excluded from this display.
        const validWishPattern=/^(?:[1-9]\d{0,3}|[1-9]\d{0,2}(?:,\d{3})) (?:million|billion|trillion) good things in life$/;
        const submitted=Object.values(data)
            .filter(item=>item && item.requestType!=="liveAnnouncement" && validWishPattern.test(String(item.message||"").trim()))
            .sort((a,b)=>getWishTimestamp(b.createdAt)-getWishTimestamp(a.createdAt));
        refreshWishActivity(submitted);
    },(error)=>{
        console.error("Could not load public wishes for ticker:",error);
        refreshWishActivity([]);
    });
}

function getWishTimestamp(value){
    if(typeof value==="number") return value;
    if(value && typeof value==="object" && typeof value.seconds==="number") return value.seconds*1000;
    const number=Number(value);
    return Number.isFinite(number)?number:0;
}

listenForPublicWishes();

function showStatus(text,error=false){
    status.textContent=text;
    status.className="status show"+(error?" error":"");
}

form.addEventListener("submit",async(e)=>{
    e.preventDefault();

    const selectedWish=wish.value.trim();
    const selectedCountry=country.value.trim();

    if(!selectedWish || !selectedCountry){
        showStatus(
            "Please select a wish quantity and your country.",

        );

    }

    button.disabled=true;

    try{

            await signInAnonymously(auth);

        await push(wishesRef,{
            message:selectedWish,
            country:selectedCountry,
            createdAt:serverTimestamp(),
            status:"new"
        });

        form.reset();

        showStatus(
            "🎉 Your birthday wish has been sent successfully!"
        );

    }catch(error){
        console.error("Birthday wish error:",error);

        showStatus(
            "We could not send your wish. Please try again.",

        );

    }finally{
        button.disabled=false;
        button.textContent="✈️   SEND BIRTHDAY WISH";
    }
});

const announcementForm=document.getElementById("announcementForm");
const announcementStatus=document.getElementById("announcementStatus");
const announcementSend=document.getElementById("announcementSend");
const announcementDate=document.getElementById("announcementDate");

function localDateKey(date=new Date()){
    const year=date.getFullYear();
    const month=String(date.getMonth()+1).padStart(2,"0");
    const day=String(date.getDate()).padStart(2,"0");
    return `${year}-${month}-${day}`;
}
function updateAnnouncementDate(){
    const now=new Date();
    announcementDate.value=now.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
    announcementDate.dataset.date=localDateKey(now);
}
updateAnnouncementDate();
setInterval(updateAnnouncementDate,60000);

function showAnnouncementStatus(message,error=false){
    announcementStatus.textContent=message;
    announcementStatus.className="announcement-status show"+(error?" error":"");
}

 ["#8A6A16","#FFF4C2"],["#596575","#FFFFFF"],["#DCEBFA","#10243A"],["#123B68","#EAF4FF"],
 ["#14543D","#E8FFF3"],["#702B3B","#FFF0F2"],["#6A4B91","#FFFFFF"],["#9B5A22","#FFF4E7"],
 ["#274B55","#F0FFFF"],["#6B4F2A","#FFF7E6"],["#46566D","#FFFFFF"],["#1D477A","#F3F8FF"],
 ["#285B4B","#F0FFF8"],["#7A344E","#FFF2F6"],["#3F4C5B","#FFFFFF"],["#6C5A22","#FFFBE6"],
 ["#354B78","#F1F5FF"],["#5A3B70","#FFF5FF"],["#8C6B25","#FFF8DB"],["#3C5969","#F2FBFF"],

const picker=document.createElement("div");
picker.className="celebration-picker";

pickerTrigger.type="button";
pickerTrigger.className="celebration-picker-trigger";
pickerTrigger.textContent="SELECT TYPE OF CELEBRATION";
pickerTrigger.setAttribute("aria-haspopup","listbox");
pickerTrigger.setAttribute("aria-expanded","false");
picker.appendChild(pickerTrigger);
const pickerMenu=document.createElement("div");
pickerMenu.className="celebration-picker-menu";
pickerMenu.setAttribute("role","listbox");
picker.appendChild(pickerMenu);
const categoryOptions=Array.from(celebrationSelect.options).filter(option=>option.value);
categoryOptions.forEach((option,index)=>{
 const choice=document.createElement("button");
 choice.type="button";
 choice.className="celebration-choice";
 choice.textContent=option.textContent;
 choice.style.background=`linear-gradient(135deg,${celebrationPalette[index][0]},${celebrationPalette[index][0]}dd)`;
 choice.style.color=celebrationPalette[index][1];
 choice.setAttribute("role","option");
 choice.setAttribute("aria-selected","false");
 choice.addEventListener("click",()=>{
  celebrationSelect.value=option.value;

  pickerTrigger.textContent=option.textContent;

  pickerMenu.querySelectorAll(".celebration-choice").forEach(item=>item.setAttribute("aria-selected","false"));
  choice.setAttribute("aria-selected","true");
  picker.classList.remove("open");
  pickerTrigger.setAttribute("aria-expanded","false");
 });

});
pickerTrigger.addEventListener("click",()=>{
 const isOpen=picker.classList.toggle("open");
 pickerTrigger.setAttribute("aria-expanded",String(isOpen));
});
document.addEventListener("click",event=>{
 if(!picker.contains(event.target)){
  picker.classList.remove("open");
  pickerTrigger.setAttribute("aria-expanded","false");
 }
});
document.addEventListener("keydown",event=>{
 if(event.key==="Escape"){
  picker.classList.remove("open");
  pickerTrigger.setAttribute("aria-expanded","false");
 }
});

const celebrationDetailsInput=document.getElementById("celebrationDetails");
const celebrationWordCount=document.getElementById("celebrationWordCount");
function countCelebrationWords(value){
    return value.trim() ? value.trim().split(/\s+/).length : 0;
}
celebrationDetailsInput.addEventListener("input",()=>{
    const words=celebrationDetailsInput.value.trim().split(/\s+/).filter(Boolean);
    if(words.length>30){
        celebrationDetailsInput.value=words.slice(0,30).join(" ");
    }
    celebrationWordCount.textContent=countCelebrationWords(celebrationDetailsInput.value)+" / 30 words";
});

announcementForm.addEventListener("submit",async(e)=>{
    e.preventDefault();
    const celebrantName=document.getElementById("celebrantName").value.trim();
    const celebrationType=document.getElementById("celebrationType").value.trim();
    const celebrationDetails=celebrationDetailsInput.value.trim();
    const selectedAnnouncementCountry=announcementCountry.value.trim();

    if(countCelebrationWords(celebrationDetails)>30){
        showAnnouncementStatus("Please keep your celebration description within 30 words.",true);
        return;
    }
    if(!celebrantName||!celebrationType||!selectedAnnouncementCountry){
        showAnnouncementStatus("Please complete all required boxes before submitting.",true);
        return;
    }

    announcementSend.disabled=true;
    announcementSend.textContent="SUBMITTING...";
    try{
        if(!auth.currentUser){
            await signInAnonymously(auth);
        }
        await push(ref(db,"birthdayWishes"),{
            requestType:"liveAnnouncement",
            celebrantName,
            celebrationType,
            celebrationDetails,
            country:selectedAnnouncementCountry,
            announcementDate:announcementDate.dataset.date || localDateKey(),
            message:"FREE LIVE ON-AIR ANNOUNCEMENT",
            createdAt:serverTimestamp(),
            status:"new"
        });
        announcementForm.reset();
        celebrationWordCount.textContent="0 / 30 words";
        showAnnouncementStatus("Your free live on-air announcement request has been submitted successfully!");
    }catch(error){
        console.error("Live announcement request error:",error);
        showAnnouncementStatus("We could not submit your request. Please try again.",true);
    }finally{
        announcementSend.disabled=false;
        announcementSend.textContent="SUBMIT FREE ANNOUNCEMENT";
    }
});
</script>
