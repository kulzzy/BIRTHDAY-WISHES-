<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Birthday Wishes</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(30,55,100,.30),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #07152f,
            #020b1c 70%,
            #06132b
        );

    color:#fff;

    padding:22px 14px 40px;
}

.page{
    width:100%;
    max-width:1100px;
    margin:auto;
}


/* =========================================
   TITLE
   EXACTLY 2 LINES
========================================= */

.title{
    margin:0;

    text-align:center;

    font-size:clamp(
        22px,
        3.5vw,
        38px
    );

    line-height:1.05;

    font-weight:950;

    letter-spacing:-.8px;

    text-transform:uppercase;

    color:#fff;
}

.title span{
    color:#ffbf16;
}


/* =========================================
   DECOR
========================================= */

.decor{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin:10px auto 14px;
}

.decor i{
    display:block;

    width:65px;

    height:3px;

    background:#ffbf16;

    border-radius:20px;
}

.decor b{
    width:9px;

    height:9px;

    background:#ffbf16;

    border-radius:50%;
}


/* =========================================
   YELLOW SELECTION BOX
   REDUCED SIZE
========================================= */

.message-card{

    position:relative;

    width:100%;

    max-width:2048px;

    height:155px;

    min-height:155px;

    margin:0 auto;

    border:2px solid #ffbf16;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #ffb913,
            #ffca31
        );

    box-shadow:
        0 12px 30px rgba(0,0,0,.35);

    overflow:hidden;
}


/* =========================================
   LOGO
   FULL LOGO VISIBLE
========================================= */

.avatar{

    position:absolute;

    left:22px;

    top:50%;

    transform:translateY(-50%);

    width:76px;

    height:76px;

    border-radius:50%;

    overflow:hidden;

    background:#ffca31;

    z-index:10;

    pointer-events:none;

    display:flex;

    align-items:center;

    justify-content:center;
}

.avatar img{

    width:100%;

    height:100%;

    display:block;

    /*
       SHOW THE WHOLE LOGO
       INSTEAD OF CUTTING THE MIDDLE
    */

    object-fit:contain;

    object-position:center;
}


/* =========================================
   WHOLE BOX IS SELECT
========================================= */

#wish{

    position:absolute;

    left:0;

    top:0;

    width:100%;

    height:100%;

    min-height:155px;

    margin:0;

    border:0;

    outline:0;

    /*
       SELECTED WISH STARTS
       IN FRONT OF THE LOGO
    */

    padding:
        0
        60px
        0
        92px;

    background:transparent;

    color:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            15px,
            2vw,
            25px
        );

    font-weight:950;

    line-height:1.18;

    cursor:pointer;

    text-align:left;

    appearance:none;

    -webkit-appearance:none;

    z-index:5;

    white-space:normal;

    overflow:hidden;

    text-overflow:ellipsis;

    background-image:

        linear-gradient(
            45deg,
            transparent 50%,
            #07152f 50%
        ),

        linear-gradient(
            135deg,
            #07152f 50%,
            transparent 50%
        );

    background-position:

        calc(100% - 40px) 50%,
        calc(100% - 27px) 50%;

    background-size:
        12px 12px,
        12px 12px;

    background-repeat:no-repeat;
}


/* =========================================
   SELECT OPTIONS
========================================= */

#wish option{

    color:#000;

    background:#ffca31;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:19px;

    font-weight:900;

    padding:8px;
}


/* =========================================
   SEND BUTTON
========================================= */

.send{

    display:block;

    margin:15px auto 25px;

    padding:13px 28px;

    min-width:280px;

    border:2px solid #ffbf16;

    border-radius:18px;

    background:#07152f;

    color:#ffbf16;

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 18px rgba(0,0,0,.35);
}

.send:active{
    transform:translateY(1px);
}

.send:disabled{
    opacity:.65;

    cursor:not-allowed;
}


/* =========================================
   STATUS
========================================= */

.status{

    display:none;

    max-width:700px;

    margin:0 auto 20px;

    padding:14px 18px;

    border-radius:12px;

    text-align:center;

    font-weight:800;
}

.status.show{

    display:block;

    background:#153f28;

    color:#b9ffd0;

    border:1px solid #42cf75;
}

.status.error{

    background:#4a1e25;

    color:#ffd1d7;

    border-color:#ff6575;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:650px){

    body{
        padding:18px 9px 30px;
    }


    /* ================================
       TITLE — EXACTLY 2 LINES
    ================================= */

    .title{

        font-size:
            clamp(
                21px,
                6.5vw,
                32px
            );

        line-height:1.06;

        letter-spacing:-.6px;
    }


    .decor{

        margin:
            9px auto
            13px;
    }

    .decor i{

        width:48px;

        height:3px;
    }

    .decor b{

        width:8px;

        height:8px;
    }


    /* ================================
       SMALLER MOBILE YELLOW BOX
    ================================= */

    .message-card{

        height:155px;

        min-height:155px;

        border-radius:16px;
    }


    /* ================================
       MOBILE LOGO
       FULL LOGO VISIBLE
    ================================= */

    .avatar{

        left:14px;

        top:50%;

        width:62px;

        height:62px;

        transform:translateY(-50%);
    }


    /* ================================
       MOBILE SELECT
       TEXT STARTS IN FRONT OF LOGO
    ================================= */

    #wish{

        width:100%;

        height:100%;

        min-height:155px;

        padding:
            0
            42px
            0
            76px;

        font-size:16px;

        line-height:1.18;

        background-position:

            calc(100% - 28px) 50%,
            calc(100% - 17px) 50%;

        background-size:
            9px 9px,
            9px 9px;
    }


    #wish option{

        font-size:16px;

        padding:7px;
    }


    /* ================================
       SEND BUTTON
    ================================= */

    .send{

        min-width:0;

        width:92%;

        margin:
            13px auto
            22px;

        font-size:16px;

        padding:12px 18px;

        border-radius:16px;
    }

}

</style>

</head>


<body>

<div class="page">


    <!-- =====================================
         TITLE — EXACTLY 2 LINES
    ====================================== -->

    <h1 class="title">

        HOW MANY GOOD THINGS IN LIFE<br>

        <span>DO YOU WISH OUR CELEBRANT?</span>

    </h1>


    <div class="decor">

        <i></i>

        <b></b>

        <i></i>

    </div>


    <form id="wishForm">


        <!-- =================================
             YELLOW SELECTION BOX
        ================================== -->

        <div class="message-card">


            <!-- =================================
                 FULL LOGO
            ================================== -->

            <div
                class="avatar"
                aria-hidden="true"
            >

                <img
                    src="data:image/jpeg;base64,YOUR_EXISTING_BASE64_IMAGE_HERE"
                    alt="Kulzzy Radio"
                >

            </div>


            <!-- =================================
                 WHOLE BOX IS SELECT
            ================================== -->

            <select
                id="wish"
                required
                aria-label="Select how many good things in life you wish our celebrant"
            >

                <option
                    value=""
                    selected
                    disabled
                >
                    SELECT HOW MANY GOOD THINGS IN LIFE YOU WISH OUR CELEBRANT
                </option>

            </select>

        </div>


        <button
            class="send"
            type="submit"
        >
            ✈️ &nbsp; SEND BIRTHDAY WISH
        </button>

    </form>


    <div
        id="status"
        class="status"
    ></div>


</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {
    getAuth,
    signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE CONFIGURATION
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDcdd3ZSae1Ddxmpw7pFVNwPNql0cF6C0E",

    authDomain:
        "birthday-wishes-960bd.firebaseapp.com",

    databaseURL:
        "https://birthday-wishes-960bd-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "birthday-wishes-960bd",

    storageBucket:
        "birthday-wishes-960bd.firebasestorage.app",

    messagingSenderId:
        "61276094940",

    appId:
        "1:61276094940:web:5863a7d82caf1628170f19",

    measurementId:
        "G-F9HZHJPXRL"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);

const auth =
    getAuth(app);


/* =========================================
   PAGE ELEMENTS
========================================= */

const form =
    document.getElementById("wishForm");

const wish =
    document.getElementById("wish");

const status =
    document.getElementById("status");

const button =
    form.querySelector(".send");


/* =========================================
   NUMBER FORMAT
========================================= */

function formatNumber(number){

    return number.toLocaleString(
        "en-US"
    );

}


/* =========================================
   BUILD WISH LIST
========================================= */

function addWish(
    number,
    unit
){

    const option =
        document.createElement("option");

    option.value =
        `${formatNumber(number)} ${unit} good things in life to you`;

    option.textContent =
        `${formatNumber(number)} ${unit} good things in life to you`;

    wish.appendChild(option);
}


/* =========================================
   MILLIONS
   1M → 999M
========================================= */

for(
    let number = 1;
    number <= 999;
    number++
){

    addWish(
        number,
        "million"
    );

}


/* =========================================
   BILLIONS
   1B → 999B
========================================= */

for(
    let number = 1;
    number <= 999;
    number++
){

    addWish(
        number,
        "billion"
    );

}


/* =========================================
   TRILLIONS
   1T → 900T
========================================= */

for(
    let number = 1;
    number <= 900;
    number++
){

    addWish(
        number,
        "trillion"
    );

}


/* =========================================
   STATUS MESSAGE
========================================= */

function showStatus(
    text,
    error = false
){

    status.textContent =
        text;

    status.className =
        "status show" +
        (
            error
            ? " error"
            : ""
        );

}


/* =========================================
   SEND SELECTED WISH
========================================= */

form.addEventListener(
    "submit",
    async (e) => {

        e.preventDefault();


        const selectedWish =
            wish.value.trim();


        if(!selectedWish){

            showStatus(
                "Please select how many good things in life you wish our celebrant.",
                true
            );

            return;

        }


        button.disabled =
            true;

        button.textContent =
            "SENDING...";


        try{

            /*
             * Anonymous authentication
             */

            if(!auth.currentUser){

                await signInAnonymously(
                    auth
                );

            }


            /*
             * Firebase location
             */

            const wishesRef =
                ref(
                    db,
                    "birthdayWishes"
                );


            /*
             * Save selected wish
             */

            await push(
                wishesRef,
                {

                    message:
                        selectedWish,

                    createdAt:
                        serverTimestamp(),

                    status:
                        "new"

                }
            );


            /*
             * Reset selection
             */

            form.reset();


            showStatus(
                "🎉 Your birthday wish has been sent successfully!"
            );


        }catch(error){

            console.error(
                "Birthday wish error:",
                error
            );


            showStatus(
                "We could not send your wish. Please try again.",
                true
            );


        }finally{

            button.disabled =
                false;

            button.textContent =
                "✈️   SEND BIRTHDAY WISH";

        }

    }
);

</script>

</body>
</html>
